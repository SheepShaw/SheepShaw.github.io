<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EDDF">
<title>你在兰香如故能活到第几集？</title>
<style>
  :root{
    --paper:#F4EDDF;
    --ink:#1F1B17;
    --cinnabar:#A63A2E;
    --ink-light:#7A6F63;
    --rule:#DDD2BE;
    --seal:#9C3226;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    /* 楷体优先（Mac/iOS/Windows 均有）→ 思源/宋体兜底，避免 Android 掉进黑体 */
    font-family:"Kaiti SC","KaiTi","STKaiti","楷体",
                "Songti SC","STSong","SimSun","宋体",
                "Noto Serif CJK SC","Source Han Serif SC","Source Han Serif CN",serif;
    font-size:17px;
    line-height:2;
    letter-spacing:.02em;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 纸纹 */
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(circle at 18% 12%, rgba(160,138,104,.07) 0%, transparent 48%),
      radial-gradient(circle at 82% 74%, rgba(160,138,104,.06) 0%, transparent 46%),
      repeating-linear-gradient(92deg, rgba(150,128,96,.022) 0 1px, transparent 1px 4px);
  }

  /* 命长刻度：线的长度＝活到第几集 */
  #thread{
    position:fixed;top:0;left:0;height:2px;width:0;z-index:60;
    background:linear-gradient(90deg,rgba(166,58,46,.25),var(--cinnabar));
    transition:width 1.1s cubic-bezier(.22,.9,.28,1);
  }

  #stage{
    position:relative;z-index:1;
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:64px 26px 72px;
  }
  .sheet{
    position:relative;width:100%;max-width:600px;
    padding-left:38px;
    transition:opacity .3s ease,transform .3s ease;
  }
  .sheet::before{ /* 朱丝栏 */
    content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;
    background:linear-gradient(180deg,rgba(166,58,46,0),rgba(166,58,46,.34) 8%,rgba(166,58,46,.34) 92%,rgba(166,58,46,0));
  }
  .sheet.out{opacity:0;transform:translateY(-9px)}
  .sheet.in{opacity:0;transform:translateY(9px)}

  /* ── 首页 · 标题与引言 ── */
  .htitle{
    font-family:"Songti SC","SimSun",serif;
    font-size:42px;line-height:1.4;font-weight:600;
    letter-spacing:.08em;
  }
  .intro{
    margin-top:28px;padding-top:20px;
    border-top:1px solid var(--rule);
    font-size:15px;line-height:2.1;color:var(--ink-light);
  }
  .intro b{color:var(--cinnabar);font-weight:400}

  /* ── 卷首 · 名册 ── */
  .lead{
    margin-top:40px;
    font-size:14px;color:var(--ink-light);letter-spacing:.14em;
    margin-bottom:26px;
  }
  .names{list-style:none}
  .names li{
    position:relative;
    display:flex;align-items:center;
    height:52px;
    border-bottom:1px solid var(--rule);
    font-size:21px;letter-spacing:.12em;
  }
  .names li:first-child{border-top:1px solid var(--rule)}
  .names li span{position:relative;z-index:2;padding-left:6px}
  .names li.picked{color:var(--cinnabar)}
  .names .circle{
    position:absolute;left:-12px;top:50%;margin-top:-26px;
    width:150px;height:52px;overflow:visible;pointer-events:none;
  }
  .names .circle path{
    fill:none;stroke:var(--cinnabar);stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:420;stroke-dashoffset:420;
  }
  .names .circle.go path{animation:draw 1.1s .35s cubic-bezier(.5,0,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  .ghost-name{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    font-size:14px;letter-spacing:.3em;color:var(--cinnabar);
    opacity:0;pointer-events:none;
  }
  .ghost-name.show{animation:ghost 2.2s ease forwards}
  @keyframes ghost{
    0%{opacity:0;filter:blur(3px)}
    22%{opacity:.9;filter:blur(0)}
    62%{opacity:.9}
    100%{opacity:0;filter:blur(2px)}
  }

  .enter{
    display:block;margin:56px auto 0;
    background:var(--cinnabar);border:1px solid var(--cinnabar);border-radius:2px;
    font:inherit;cursor:pointer;
    color:var(--paper);font-size:21px;font-weight:700;letter-spacing:.42em;
    padding:16px 42px 16px 48px;
    box-shadow:0 6px 22px rgba(166,58,46,.22);
    opacity:0;transition:opacity .6s ease,background .3s ease,color .3s ease,box-shadow .3s ease;
  }
  .enter.on{opacity:1}
  .enter.on:hover,.enter.on:active{background:#8E2F25;border-color:#8E2F25;box-shadow:0 6px 22px rgba(166,58,46,.34)}

  /* ── 题目 ── */
  .qhead{
    display:flex;align-items:baseline;gap:14px;
    margin-bottom:22px;
  }
  .qno{font-size:13px;letter-spacing:.34em;color:var(--cinnabar)}
  .qtext{
    font-size:18.5px;line-height:2.05;
    margin-bottom:34px;
    text-align:justify;
  }

  .opts{list-style:none}
  .opt{
    position:relative;
    display:flex;gap:14px;align-items:flex-start;
    padding:15px 44px 15px 14px;
    margin-left:-14px;
    border-left:2px solid transparent;
    cursor:pointer;
    transition:border-color .25s ease,background .25s ease,transform .25s ease;
  }
  .opt + .opt{border-top:1px solid rgba(221,210,190,.55)}
  .opt:hover{border-left-color:var(--cinnabar);background:rgba(166,58,46,.035);transform:translateX(3px)}
  .opt .k{
    flex:0 0 auto;
    font-family:"Songti SC","SimSun",serif;
    font-size:15px;letter-spacing:.1em;color:var(--ink-light);
    padding-top:4px;transition:color .25s ease;
  }
  .opt:hover .k{color:var(--cinnabar)}
  .opt .t{font-size:17px;line-height:1.85}
  .opt.done{pointer-events:none;background:rgba(166,58,46,.05);border-left-color:var(--cinnabar)}
  .opt.done .k,.opt.done .t{color:var(--cinnabar)}
  .opt .tick{
    position:absolute;right:10px;top:50%;margin-top:-11px;
    width:22px;height:22px;opacity:0;
  }
  .opt.done .tick{opacity:1}
  .opt .tick path{
    fill:none;stroke:var(--cinnabar);stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:32;stroke-dashoffset:32;
  }
  .opt.done .tick path{animation:draw .34s cubic-bezier(.5,0,.3,1) forwards}

  /* ── 结局 ── */
  .ehead{
    font-family:"Songti SC","SimSun",serif;
    font-size:20px;font-weight:600;letter-spacing:.16em;
    color:var(--cinnabar);margin-bottom:14px;
  }
  .etitle{
    font-family:"Songti SC","SimSun",serif;
    font-size:29px;font-weight:700;letter-spacing:.08em;
    line-height:1.5;margin-bottom:30px;
  }
  .ebody p{margin-bottom:19px;text-align:justify}
  .ebody p:last-child{margin-bottom:0}

  .equote{
    position:relative;
    margin:34px 0 40px;
    padding:2px 0 2px 20px;
    border-left:2px solid var(--cinnabar);
    font-size:17.5px;line-height:1.95;color:var(--cinnabar);
  }

  .sealwrap{display:flex;justify-content:flex-end;margin:4px -8px 0 0}
  .seal{
    position:relative;
    width:150px;height:150px;
    border:4px solid var(--seal);border-radius:3px;
    display:grid;
    grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    color:var(--seal);
    font-family:"Kaiti SC","KaiTi","STKaiti","楷体","Kai",
                "Songti SC","STSong","SimSun","宋体","Noto Serif CJK SC","Source Han Serif SC",serif;
    font-size:66px;font-weight:700;line-height:1;letter-spacing:0;
    transform:rotate(-5deg) scale(1.7);
    opacity:0;
    animation:stamp .62s .15s cubic-bezier(.2,1.35,.4,1) forwards;
    box-shadow:inset 0 0 0 1px rgba(156,50,38,.35);
  }
  .seal span{display:grid;place-items:center;transform:translateY(1px)}
  .seal::after{
    content:"";position:absolute;inset:0;border-radius:2px;pointer-events:none;
    background:
      radial-gradient(circle at 22% 26%, transparent 46%, rgba(244,237,223,.34) 74%, transparent 78%),
      radial-gradient(circle at 76% 82%, transparent 52%, rgba(244,237,223,.28) 76%, transparent 80%),
      repeating-linear-gradient(48deg, rgba(244,237,223,.14) 0 1px, transparent 1px 3px);
    mix-blend-mode:screen;
  }
  @keyframes stamp{
    0%{opacity:0;transform:rotate(-4deg) scale(1.7)}
    58%{opacity:1;transform:rotate(-4deg) scale(.955)}
    100%{opacity:1;transform:rotate(-4deg) scale(1)}
  }

  /* ── 结局页操作 ── */
  .acts{
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
    margin-top:48px;
  }
  .acts button{
    background:none;border:1px solid var(--cinnabar);border-radius:2px;
    font:inherit;cursor:pointer;
    color:var(--cinnabar);font-size:18px;font-weight:700;letter-spacing:.28em;
    padding:12px 26px 12px 30px;
    transition:background .25s ease,color .25s ease;
  }
  .acts button:hover{background:var(--cinnabar);color:var(--paper)}
  .acts button.solid{background:var(--cinnabar);color:var(--paper)}
  .acts button.solid:hover{background:#8E2F25;border-color:#8E2F25}

  /* ── 分享卡 ── */
  .sharemask{
    position:fixed;inset:0;z-index:200;
    background:rgba(22,18,14,.78);
    display:flex;align-items:center;justify-content:center;
    padding:26px 18px;overflow:auto;
  }
  .sharebox{width:100%;max-width:400px;text-align:center}
  .sharebox img{
    width:100%;display:block;border-radius:2px;
    box-shadow:0 14px 44px rgba(0,0,0,.45);
  }
  .sharetip{
    margin:16px 0 14px;color:var(--paper);
    font-size:13px;letter-spacing:.1em;opacity:.82;line-height:1.8;
  }
  .shareacts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .shareacts a,.shareacts button{
    font-family:inherit;font-size:14px;letter-spacing:.2em;
    padding:11px 22px;border-radius:2px;cursor:pointer;text-decoration:none;
    border:1px solid var(--cinnabar);background:var(--cinnabar);color:var(--paper);
  }
  .shareacts .ghost{background:none;color:var(--paper);border-color:rgba(244,237,223,.45)}

  @media (max-width:560px){
    body{font-size:17.5px;line-height:1.95}
    #stage{padding:52px 18px 60px}
    .sheet{padding-left:24px}
    .htitle{font-size:32px;letter-spacing:.05em}
    .intro{font-size:16px;line-height:2.05;margin-top:24px}
    .lead{margin-top:30px;font-size:14.5px}
    .names li{height:50px;font-size:20.5px}
    .names .circle{width:150px;height:50px;margin-top:-25px;left:-4px}
    .enter{font-size:21px;padding:16px 36px 16px 40px;margin:46px auto 0;letter-spacing:.34em}
    .qhead{margin-bottom:18px}
    .qno{font-size:14px;letter-spacing:.3em}
    .qtext{font-size:19px;line-height:2;margin-bottom:28px}
    .opt{padding:15px 34px 15px 11px;margin-left:-11px;gap:12px}
    .opt .k{font-size:16px;padding-top:5px}
    .opt .t{font-size:18px;line-height:1.85}
    .ehead{font-size:21px;letter-spacing:.13em}
    .etitle{font-size:27px;margin-bottom:24px}
    .ebody p{margin-bottom:18px}
    .seal{width:116px;height:116px;font-size:52px;border-width:3px}
    .sealwrap{margin:6px -4px 0 0}
    .equote{font-size:18.5px;line-height:1.95;margin:30px 0 34px;padding-left:17px}
    .acts{margin-top:42px;gap:12px}
    .acts button{font-size:18px;letter-spacing:.22em;padding:13px 24px 13px 28px}
    .sharetip{font-size:14.5px}
    .shareacts a,.shareacts button{font-size:15.5px;padding:12px 20px}
  }
  @media (max-width:400px){
    body{font-size:17px}
    #stage{padding:46px 15px 54px}
    .sheet{padding-left:20px}
    .htitle{font-size:29px}
    .intro{font-size:15.5px}
    .names li{height:47px;font-size:19.5px}
    .names .circle{width:140px;height:47px;margin-top:-24px;left:-2px}
    .enter{font-size:19.5px;padding:15px 30px 15px 34px;letter-spacing:.28em}
    .qtext{font-size:18px}
    .opt .t{font-size:17px}
    .ehead{font-size:20px}
    .etitle{font-size:25px}
    .seal{width:104px;height:104px;font-size:46px}
    .equote{font-size:17.5px}
    .acts button{font-size:17.5px;letter-spacing:.18em;padding:13px 20px 13px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="thread"></div>
<div id="stage"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
  "use strict";

  var TOTAL_EP = 47;
  var CN = ["甲", "乙", "丙", "丁"];

  var Q = [
    {
      no: "其 一", ep: 3, epLabel: "第 3 集",
      text: "进府第三日，管事婆子把你们四个新来的丫鬟领到正院。大奶奶赵星棠歪在榻上，手里拿着一本账册。她看得很慢，一页要看很久，眼也没抬，问你们会做什么活。",
      opts: [
        { k: "A", t: "你把绣帕递上去：「回大奶奶，奴婢会些女红。」" },
        { k: "B", t: "你着急说：「回大奶奶，奴婢什么都不会，但奴婢勤快。」" },
        { k: "C", t: "你盯着大奶奶手中的账本说：「奴婢识得字，认得账，可帮大奶奶。」", end: 1 },
        { k: "D", t: "你低着头盯着地板，怯生生说：「会洗衣打扫，也下得厨。」" }
      ]
    },
    {
      no: "其 二", ep: 19.5, epLabel: "第 19 — 20 集",
      text: "你晋升了二等丫鬟，专管茶水房事务。最近府中接连闹病，先是玉蝉起了一身红疹，接着是秦氏，再接着一个接一个倒下。官府来了人，站在门外问你：是不是闹了时疫。",
      opts: [
        { k: "A", t: "你怕得很，大喊：「就是时疫！救我出去！救我出去！」", end: 2 },
        { k: "B", t: "你发现病倒的人都是用了热水，让大家今后只用凉水。" },
        { k: "C", t: "你怀疑有人投毒，偷偷将热水送去太医院检验。" },
        { k: "D", t: "你建议先把染病的人挪到一处空屋隔离，所有人用手帕掩住口鼻。" }
      ]
    },
    {
      no: "其 三", ep: 25, epLabel: "第 25 集",
      text: "你救了林府，大太太许你一家三口脱了籍，你和父母住在城南小院。日子安稳地过着。这天邻居韩粱的母亲上门提亲，话还没说完，圣旨到了：林锦岐救驾有功，圣上赐婚许兰香。满院的人都跪下了，这时你——",
      opts: [
        { k: "A", t: "心想还有这等好事，我果真是千金命！你立马磕头谢恩。" },
        { k: "B", t: "看了眼韩粱，跪恩接旨，当天连夜收拾包袱与韩郎君逃出了城门。", end: 3 },
        { k: "C", t: "按住了爹爹的手，跪恩接旨，眼角含着屈辱的泪。" },
        { k: "D", t: "接旨，心中盘算：爬得更高，也许更有机会替沈家鸣冤。" }
      ]
    },
    {
      no: "其 四", ep: 32.5, epLabel: "第 32 — 33 集",
      text: "嫁入林家后你逐渐获得掌事大权，林锦岐也被你拿捏得死死的，最怕你说和离。这天大妹妹林绣莱抱着女儿回来，跪在正厅，撸起袖子——手臂上没有一块好肉。她嫁给举人鲁鉴六年，三千两嫁妆被他赌个干净。你准备——",
      opts: [
        { k: "A", t: "劝她为了一双儿女再忍几年，等鲁鉴回心转意。" },
        { k: "B", t: "哥哥嫂嫂替你讨回公道！状告鲁家要求和离！" },
        { k: "C", t: "带人闯进鲁家，把大妹妹抢回来，让全金陵都知道鲁鉴是禽兽。", end: 4 },
        { k: "D", t: "你去请族老出面，让长辈们去鲁家讨个说法，与鲁鉴和离。" }
      ]
    },
    {
      no: "其 五", ep: 45, epLabel: "第 45 集",
      text: "杜翠雀居然成为了海贼王，回来复仇了！她穿着一身大红嫁衣站在林府门外，身后是一队海匪，手里一支火铳。府里只有丫鬟、织娘和几个婆子。",
      opts: [
        { k: "A", t: "你戴好女主光环，提一盏灯笼走出去当面对峙，说服她。", end: 5 },
        { k: "B", t: "全府的灯都灭了。四散躲藏起来，等待林锦岐回来救援。" },
        { k: "C", t: "留得青山在不怕没柴烧，带着女眷钻狗洞跑路，保命要紧。" },
        { k: "D", t: "我赌子弹没我快，将灯油泼在她身上，点燃火折子将她烧死。" }
      ]
    },
    {
      no: "其 六", ep: 47, epLabel: "第 47 集",
      text: "你活到八十多岁，在一个睡梦里走的，无病无痛。手里攥着一个香囊，攥得很紧。香囊里装着——",
      opts: [
        { k: "A", t: "一个字条，只有一个字，是血写的：活。", end: 7 },
        { k: "B", t: "一根褪了色的红线。", end: 6 }
      ]
    }
  ];

  var E = {
    1: {
      ep: 5, epLabel: "第 5 集", title: "你被杖毙了", seal: ["识字", "认账"],
      body: [
        "赵星棠瞟了你一眼，笑了，说这丫头伶俐，留在正院伺候。",
        "第七天，你被支去库房取东西。回来的时候，箱笼已经被人翻开了——大奶奶丢的那枚金戒指，从你的铺盖底下被掏了出来。",
        "杖责八十，你趴在雪地里喊冤，喊到嗓子出血。不久便咽了气。",
        "你到最后都没弄明白，自己到底错在哪一步。",
        "——不，你其实明白。你想起来她翻账册的时候，一页要看那么久。"
      ],
      quote: "在这座府里，识字认账的丫鬟，一个青葙就够了。"
    },
    2: {
      ep: 19, epLabel: "第 19 集", title: "因「时疫」而死", seal: ["人祸", "难防"],
      body: [
        "当天下午，官府的封条就贴上了林府的门。",
        "门是从外头钉死的。药从墙头吊进来，饭放在门槛外。官府只封门，不施药，说是怕人跑出去。",
        "你刚开始没有起疹子。你只是被关在里头，看着每天都有人被抬出去。",
        "第十四天。抬出去的人里，有你。",
        "杜翠雀的案子是后来才查清的——南疆的秘毒混在浴水里，她被判了流放琼州。",
        "你到死都以为自己是因为「时疫」丧了命。"
      ],
      quote: "人祸难防。"
    },
    3: {
      ep: 28, epLabel: "第 28 集", title: "亡命鸳鸯", seal: ["亡命", "鸳鸯"],
      body: [
        "逃出城门后，一路往南，从泉州上的船，最后在一个不知名的岛国落了脚。",
        "这里一年到头都是酷热，当地人肤色古铜，看你们眼中满是新鲜，但并无恶意。韩粱满腹经纶在这没了用武之地，靠着捕鱼为生；你凭一双巧手，贩卖新奇小玩意贴补家用。",
        "日子也算一天天好起来了。你俩也晒得黝黑，融入了当地生活。置了院子，种了树，养了两只鸡。",
        "第三年，有故国的商人到来，你们听到只言片语：当今圣上……科举……新状元……你攥了攥韩粱的手，韩粱回过神来，说：回家吃饭吧。",
        "而你每年清明会在院里烧一次纸。是一份状纸，落款沈嘉兰，写完就烧。",
        "韩粱走的时候年过古稀。你走的时候，枕头底下压着一张纸。上面只写了一行，是给天上的母亲看的：女儿活得很好。"
      ],
      quote: "你们这一生没有一天不安稳。也没有一天不想回去。"
    },
    4: {
      ep: 33, epLabel: "第 33 集", title: "青灯古佛", seal: ["青灯", "古佛"],
      body: [
        "你带了九皋南客和几个壮硕的家丁，从后门砸进鲁家的院子。",
        "大妹妹林绣莱被锁在房中，被你搀着出来的时候已经哭的没了力气。",
        "鲁鉴也没打算就这么算了。他把你告到府衙，强抢民女，持械伤人，罔顾人伦纲常，败坏祖宗礼法。",
        "诰命夫人的身份为你挡了这一灾。官府的判词写的是「两家姻亲，一时争执」。人是抢回来了。但孩子抢不回来——按律儿女归父，芝姐儿和弟弟还留在鲁家。",
        "老太爷把你叫到祠堂。他没骂你，只伸手要走了你腰上的对牌和钥匙，说：「往后府里的事，不用你管了。」",
        "渐渐的，你失了人心更失了心气，搬入了后院佛堂，日日为沈家亡魂诵经。",
        "你活到了耄耋之年。府里换过两代下人，新来的已经不知道你是谁，只知道后院佛堂里住着一位老太太。"
      ],
      quote: "林家的故事还在继续，只是再与你无关。"
    },
    5: {
      ep: 45, epLabel: "第 45 集", title: "反派话不多", seal: ["人狠", "话少"],
      body: [
        "你提着一盏灯笼走出大门，还没开口，杜翠雀就举起火铳，大叫一声：许兰香，去死吧！",
        "你只看到火光一闪，便再也没了意识。"
      ],
      quote: "能成为海贼王的女人，人狠话不多。"
    },
    6: {
      ep: 48, epLabel: "第 48 集", title: "白头偕老", seal: ["白头", "偕老"],
      body: [
        "那年他把线一圈一圈缠在两人身上，说：我妻订婚叫沈嘉兰，嫁我叫许兰香，红线系的一直是一个人，下辈子别认错。",
        "你笑他矫情。",
        "他后来回了朝堂，从指挥使做到尚书，不是为了他自己。",
        "沈家的案，你没瞒他，他替你翻旧档、递折子。你在府里用沈家冤案写话本，沈嘉兰这个名字先在乡野中传开了。",
        "新皇仁慈，准许重审冤案，翻案那天你跪在圣旨前，听太监把「沈嘉兰」三个字念了出来。",
        "你没有哭。他哭了。",
        "后来的日子里，沈嘉兰这个名字重回日光下。",
        "他七十八岁那年走的。走之前他说：下辈子别认错。"
      ],
      quote: "这一辈子，名字要回来了，人也留住了。一样都没落下。"
    },
    7: {
      ep: 47, epLabel: "第 47 集", title: "一个「活」字", seal: ["谁都", "不欠"],
      body: [
        "那年你在船上醒过来，母亲已经不在了。这张纸你收在香囊里，攥了七十多年。",
        "你假装不识字，看不懂那是佛经还是账本。时疫的水样你送去了太医院。圣旨赐婚你接了，喜堂上给了他一巴掌。绣莱哭着回娘家那天，你说「这事哥哥嫂嫂替你讨回公道」。杜翠雀复仇那晚，你勇敢地朝她扔了火折子。",
        "你把每一件该做的事都做了。",
        "然后你看着人来人往，活到很老。"
      ],
      quote: "这一辈子，你谁都没欠。"
    }
  };

  var sheet = document.getElementById("sheet");
  var thread = document.getElementById("thread");
  var qi = 0;

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function setThread(ep){
    var pct = Math.min(100, ep / TOTAL_EP * 100);
    thread.style.width = pct.toFixed(2) + "%";
  }

  function swap(html, after){
    sheet.classList.add("out");
    setTimeout(function(){
      sheet.innerHTML = html;
      sheet.classList.remove("out");
      sheet.classList.add("in");
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          sheet.classList.remove("in");
          if (after) after();
        });
      });
    }, 300);
  }

  /* ── 卷首 ── */
  function cover(){
    setThread(0);
    var html =
      '<h1 class="htitle">你在兰香如故<br>能活到第几集？</h1>' +
      '<p class="intro">你是沈嘉兰，沈家唯一幸存者，也是许兰香，顶替了她杂役丫鬟的身份。<br>' +
        '林府大宅门中重活一世，你的路要怎么走……</p>' +
      '<div class="lead">今有新婢四名入林府</div>' +
      '<ul class="names">' +
        '<li class="picked"><span>许兰香</span>' +
          '<svg class="circle" viewBox="0 0 168 54" preserveAspectRatio="none">' +
            '<path d="M158 27 C158 41 124 50 82 50 C40 50 8 41 8 27 C8 13 42 5 82 5 C122 5 158 13 158 27"/>' +
          '</svg>' +
          '<em class="ghost-name">沈嘉兰</em>' +
        '</li>' +
        '<li><span>吕蕺儿</span></li>' +
        '<li><span>周甘棠</span></li>' +
        '<li><span>杜小莲</span></li>' +
      '</ul>' +
      '<button class="enter" id="enter">入 府</button>';

    swap(html, function(){
      var picked = sheet.querySelector(".picked");
      var circle = sheet.querySelector(".circle");
      var ghost = sheet.querySelector(".ghost-name");
      var btn = document.getElementById("enter");

      setTimeout(function(){ circle.classList.add("go"); }, 400);
      setTimeout(function(){ ghost.classList.add("show"); }, 1350);
      setTimeout(function(){ btn.classList.add("on"); }, 1900);

      btn.addEventListener("click", next);
    });
  }

  /* ── 题目 ── */
  function renderQ(){
    var q = Q[qi];
    setThread(q.ep);

    var html =
      '<div class="qhead"><span class="qno">' + q.no + '</span></div>' +
      '<p class="qtext">' + esc(q.text) + '</p>' +
      '<ul class="opts">' +
      q.opts.map(function(o, i){
        return '<li class="opt" data-i="' + i + '">' +
          '<span class="k">' + CN[i] + '</span>' +
          '<span class="t">' + esc(o.t) + '</span>' +
          '<svg class="tick" viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 5.5"/></svg>' +
        '</li>';
      }).join("") +
      '</ul>';

    swap(html, function(){
      var opts = sheet.querySelectorAll(".opt");
      Array.prototype.forEach.call(opts, function(el){
        el.addEventListener("click", function(){
          if (el.classList.contains("done")) return;
          el.classList.add("done");
          var o = q.opts[+el.dataset.i];
          setTimeout(function(){
            if (o.end) { showEnding(o.end); }
            else { qi++; renderQ(); }
          }, 420);
        });
      });
    });
  }

  function next(){
    qi = 0;
    renderQ();
  }

  /* ── 分享卡：把结局画成一张图 ── */
  function sealChars(e){
    return ((e.seal[0] || "") + (e.seal[1] || "")).split("");
  }

  function wrapLines(ctx, text, maxW){
    var out = [], cur = "";
    for (var i = 0; i < text.length; i++){
      var ch = text[i];
      if (cur && ctx.measureText(cur + ch).width > maxW){ out.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }

  function buildShareCanvas(e){
    var W = 750, PAD = 78, maxW = W - PAD * 2;
    var FAM_S = '"Songti SC","SimSun","STSong",serif';
    var FAM_K = '"Kaiti SC","KaiTi","STKaiti","楷体","Songti SC","SimSun","Noto Serif CJK SC",serif';

    var mc = document.createElement("canvas").getContext("2d");
    function collect(text, px, weight, fam, w){
      mc.font = weight + " " + px + "px " + fam;
      return wrapLines(mc, text, w);
    }

    var headTxt  = "你活到了" + e.epLabel.replace(/\s/g, "");
    var headLines  = collect(headTxt, 26, "400", FAM_S, maxW);
    var titleLines = collect(e.title, 54, "700", FAM_S, maxW);
    var bodyLines  = [];
    e.body.forEach(function(p){
      bodyLines = bodyLines.concat(collect(p, 26, "400", FAM_K, maxW));
    });
    var quoteLines = collect(e.quote, 30, "600", FAM_S, maxW - 44);

    var H = PAD * 2
          + headLines.length * 40 + 30
          + titleLines.length * 74 + 46
          + bodyLines.length * 46 + 46
          + quoteLines.length * 52 + 78
          + 200;

    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var x = c.getContext("2d");

    /* 纸 */
    x.fillStyle = "#F4EDDF"; x.fillRect(0, 0, W, H);
    var g = x.createRadialGradient(W * .18, H * .12, 0, W * .18, H * .12, W);
    g.addColorStop(0, "rgba(160,138,104,.09)"); g.addColorStop(1, "rgba(160,138,104,0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = "#A63A2E"; x.fillRect(0, 0, W, 4);
    x.fillStyle = "rgba(166,58,46,.30)"; x.fillRect(PAD - 26, PAD, 1, H - PAD * 2);

    var y = PAD + 6;
    x.textBaseline = "alphabetic";

    /* 你活到了第 X 集 */
    x.fillStyle = "#A63A2E";
    x.font = "400 26px " + FAM_S;
    headLines.forEach(function(l){ x.fillText(l, PAD, y + 26); y += 40; });

    y += 30;
    x.fillStyle = "#1F1B17";
    x.font = "700 54px " + FAM_S;
    titleLines.forEach(function(l){ x.fillText(l, PAD, y + 54); y += 74; });

    y += 46;
    x.fillStyle = "#3A342D";
    x.font = "400 26px " + FAM_K;
    bodyLines.forEach(function(l){ x.fillText(l, PAD, y + 26); y += 46; });

    /* 金句 */
    y += 46;
    x.fillStyle = "rgba(166,58,46,.85)";
    x.fillRect(PAD, y - 34, 4, quoteLines.length * 52 + 6);
    x.fillStyle = "#A63A2E";
    x.font = "600 30px " + FAM_S;
    quoteLines.forEach(function(l){ x.fillText(l, PAD + 22, y + 30); y += 52; });

    /* 朱印 */
    var S = 190;
    x.save();
    x.translate(W - PAD - S / 2, H - PAD - S / 2);
    x.rotate(-5 * Math.PI / 180);
    x.strokeStyle = "#9C3226"; x.lineWidth = 6;
    x.strokeRect(-S / 2, -S / 2, S, S);
    x.fillStyle = "#9C3226";
    x.font = "700 86px " + FAM_K;
    x.textAlign = "center"; x.textBaseline = "middle";
    var ch = sealChars(e), q = S / 4;
    x.fillText(ch[0] || "", -q, -q + 2);
    x.fillText(ch[1] || "",  q, -q + 2);
    x.fillText(ch[2] || "", -q,  q + 2);
    x.fillText(ch[3] || "",  q,  q + 2);
    x.restore();
    x.textAlign = "left"; x.textBaseline = "alphabetic";

    /* 落款 */
    x.fillStyle = "#7A6F63";
    x.font = "400 22px " + FAM_S;
    x.fillText("兰香如故 · 你在林府能活到第几集", PAD, H - PAD - 14);

    return c;
  }

  function openShare(e){
    var c = buildShareCanvas(e);
    var url;
    try { url = c.toDataURL("image/png"); }
    catch (err) { alert("生成失败了，换个浏览器试试"); return; }

    var mask = document.createElement("div");
    mask.className = "sharemask";
    mask.innerHTML =
      '<div class="sharebox">' +
        '<img alt="结果卡" src="' + url + '">' +
        '<div class="sharetip">长按图片保存到相册</div>' +
        '<div class="shareacts">' +
          '<a download="兰香如故·' + e.epLabel.replace(/\s/g, "") + '·' + e.title + '.png" href="' + url + '">保存图片</a>' +
          '<button class="ghost" type="button">关 闭</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);

    mask.addEventListener("click", function(ev){
      if (ev.target === mask) mask.remove();
    });
    mask.querySelector(".ghost").addEventListener("click", function(){ mask.remove(); });
  }

  /* ── 结局 ── */
  function showEnding(id){
    var e = E[id];
    setThread(e.ep);

    var html =
      '<div class="ehead">你活到了' + e.epLabel + '</div>' +
      '<h2 class="etitle">' + esc(e.title) + '</h2>' +
      '<div class="ebody">' + e.body.map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("") + '</div>' +
      '<blockquote class="equote">' + esc(e.quote) + '</blockquote>' +
      '<div class="sealwrap"><div class="seal">' +
        sealChars(e).map(function(c){ return '<span>' + esc(c) + '</span>'; }).join("") +
      '</div></div>' +
      '<div class="acts">' +
        '<button type="button" class="solid" id="share">分 享 结 果</button>' +
        '<button type="button" id="again">重 新 入 府</button>' +
      '</div>';

    swap(html, function(){
      document.getElementById("again").addEventListener("click", cover);
      document.getElementById("share").addEventListener("click", function(){ openShare(e); });
    });
  }

  cover();
})();
</script>
