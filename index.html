<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SheepShaw · 小工具站</title>
<style>
  :root{--base:#e8dcc8;--card:#fffdf8;--ink:#2b1d16;--muted:#6f5a45;--teal:#4c6b6a;--orange:#d77b50}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;color:var(--ink);
    background:radial-gradient(circle at 20% 0%,rgba(215,123,80,.22) 0 14rem,transparent 20rem),linear-gradient(150deg,#f6e6c9,#e8d4b6 60%,#dcae8a);
    display:grid;place-items:center;padding:40px}
  .wrap{width:min(560px,100%);background:var(--card);border:10px solid #fffaf5;border-bottom-width:26px;
    border-radius:22px;box-shadow:0 24px 56px rgba(32,18,8,.2);padding:clamp(28px,5vw,44px)}
  h1{margin:0 0 4px;font-size:clamp(30px,6vw,46px);letter-spacing:-.04em}
  p.tag{margin:0 0 22px;color:var(--muted);font-size:15px;letter-spacing:.04em}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  a{display:block;padding:16px 20px;border-radius:14px;border:1.5px solid rgba(69,45,21,.18);
    background:rgba(255,255,255,.6);color:var(--ink);text-decoration:none;font-size:17px;font-weight:600;
    transition:transform .2s,border-color .2s,background .2s}
  a:hover{transform:translateX(3px);border-color:var(--teal);background:#fff}
  a span{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:3px}
</style>
</head>
<body>

    </ul>

</html>
